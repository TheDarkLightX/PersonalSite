name: Check illustrated halting essay

on:
  push:
    paths:
      - 'essays/why-cant-a-turing-machine-predict-its-own-death.html'
      - 'tools/check_halting_essay.py'
      - 'tools/check_halting_browser.py'
      - 'assets/essays/halting-paradox/*.svg'
      - 'assets/css/halting-essay.css'
      - '.github/workflows/check-halting-essay.yml'
  pull_request:
    paths:
      - 'essays/why-cant-a-turing-machine-predict-its-own-death.html'
      - 'tools/check_halting_essay.py'
      - 'tools/check_halting_browser.py'
      - 'assets/essays/halting-paradox/*.svg'
      - 'assets/css/halting-essay.css'
      - '.github/workflows/check-halting-essay.yml'

jobs:
  check-illustrations:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate external SVGs, captions, and navigation
        run: python3 tools/check_halting_essay.py

      - name: Install Chrome browser test dependencies
        run: python3 -m pip install selenium pillow
      - name: Verify all figures in Chrome on desktop and mobile
        run: python3 tools/check_halting_browser.py --output /tmp/halting-qa
      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: halting-essay-visual-qa
          path: /tmp/halting-qa/
          if-no-files-found: ignore
