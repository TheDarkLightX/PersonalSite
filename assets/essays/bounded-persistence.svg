<path d="M163.76,637.08 h18.72 l-3.6400000000000006,6.24 l3.6400000000000006,6.24 h-18.72 Z" fill="#086451"/>
<text x="230" y="542" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#242b2b" text-anchor="start">PAUSED</text>
<text x="230" y="585" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#242b2b" text-anchor="start">The run used up its budget.</text>
<text x="230" y="623" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#58615e" text-anchor="start">The frontier is still open.</text>
<text x="230" y="654" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#58615e" text-anchor="start">Save it and ask whether to resume.</text>
<text x="40" y="714" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#242b2b" text-anchor="start">A timeout is evidence about the run, not proof about the maze.</text>
