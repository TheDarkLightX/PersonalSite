<text x="230" y="328" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#242b2b" text-anchor="start">EXHAUSTED</text>
<text x="230" y="371" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#242b2b" text-anchor="start">Every reachable cell was checked.</text>
<text x="230" y="409" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#58615e" text-anchor="start">The added wall disconnects the flag.</text>
<text x="230" y="440" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#58615e" text-anchor="start">No route exists in this fixed maze.</text>
