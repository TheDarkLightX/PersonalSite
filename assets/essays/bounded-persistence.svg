<text x="66.0" y="120.16" font-family="Arial, Helvetica, sans-serif" font-size="12.48" font-weight="700" fill="#faf9f5" text-anchor="middle">S</text>
<rect x="158.04" y="207.0" width="23.92" height="26.0" rx="0" fill="#faf9f5" stroke="#faf9f5" stroke-width="2"/>
<line x1="163.76" y1="230.4" x2="163.76" y2="209.08" stroke="#242b2b" stroke-width="2.5" stroke-linecap="round"/>
<path d="M163.76,209.08 h18.72 l-3.6400000000000006,6.24 l3.6400000000000006,6.24 h-18.72 Z" fill="#086451"/>
<text x="230" y="114" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#086451" text-anchor="start">SOLVED</text>
<text x="230" y="157" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#242b2b" text-anchor="start">A checked route reaches the flag.</text>
<text x="230" y="195" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#58615e" text-anchor="start">Keep the route as evidence.</text>
<text x="230" y="226" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#58615e" text-anchor="start">The task is complete.</text>
