<svg xmlns="http://www.w3.org/2000/svg" width="720" height="744" viewBox="0 0 720 744" role="img" aria-labelledby="title desc">
<title id="title">Three reasons a search can end</title><desc id="desc">Solved: a legal route reaches the flag. Exhausted: after closing one passage, every reachable cell is checked and the flag is outside that component. Paused: only a route prefix was explored when the budget expired; the goal is still reachable.</desc>
