<svg xmlns="http://www.w3.org/2000/svg" width="720" height="680" viewBox="0 0 720 680" role="img" aria-labelledby="title desc">
<title id="title">Remember the branch. Keep the junction.</title><desc id="desc">An exact 7 by 5 maze. A solid teal route connects S to the flag through open passages. A dashed ochre branch ends at a cross. The two routes share one junction; rejecting that whole junction would discard the solution.</desc>
