<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">The cyborg scientist workflow</title>
  <desc id="desc">A human scientist sets the question, context, and responsibility. AI agents search, simulate, translate, and propose. Formal and empirical verifiers accept or reject scoped results. Counterexamples return to refine the question. PopperPad preserves the complete append-only evidence lineage.</desc>
  <style>
    :root { color-scheme: light dark; }
    .bg { fill: #fafafa; }
    .box { fill: #fafafa; stroke: #111111; stroke-width: 1.5; }
    .box-soft { fill: #f0f0f0; stroke: #111111; stroke-width: 1.5; }
    .memory { fill: #fafafa; stroke: #111111; stroke-width: 1.25; }
    .wire { fill: none; stroke: #d5d5d5; stroke-width: 2; }
    .proposal {
      fill: none;
      stroke: #111111;
      stroke-width: 2;
      stroke-dasharray: 3 11;
      animation: proposal-flow 8s linear infinite;
    }
    .accepted {
      fill: none;
      stroke: #111111;
      stroke-width: 3;
      stroke-dasharray: 12 8;
      animation: accepted-flow 7s linear infinite;
    }
    .rejected {
      fill: none;
      stroke: #8a1a1a;
      stroke-width: 2;
      stroke-dasharray: 5 8;
      animation: rejected-flow 6s linear infinite;
    }
    .packet { fill: #111111; }
    .packet-danger { fill: #8a1a1a; }
    .kicker {
      font: 500 14px "SFMono-Regular", "SF Mono", Consolas, monospace;
      letter-spacing: 1.8px;
      fill: #666666;
    }
    .label {
      font: 500 22px "Helvetica Neue", Arial, sans-serif;
      fill: #111111;
    }
    .small {
      font: 400 15px "Helvetica Neue", Arial, sans-serif;
      fill: #666666;
    }
    .tiny {
      font: 500 13px "SFMono-Regular", "SF Mono", Consolas, monospace;
      fill: #666666;
      letter-spacing: 0.8px;
    }
    .danger-text { fill: #8a1a1a; }
    .rule { stroke: #d5d5d5; stroke-width: 1; }
    @keyframes proposal-flow { to { stroke-dashoffset: -112; } }
    @keyframes accepted-flow { to { stroke-dashoffset: -140; } }
    @keyframes rejected-flow { to { stroke-dashoffset: 104; } }
    @media (prefers-color-scheme: dark) {
      .bg, .box, .memory { fill: #0a0a0a; }
      .box-soft { fill: #151515; }
      .box, .box-soft, .memory, .proposal, .accepted { stroke: #f2f2f2; }
      .wire, .rule { stroke: #343434; }
      .rejected { stroke: #d97070; }
      .packet { fill: #f2f2f2; }
      .packet-danger, .danger-text { fill: #d97070; }
      .kicker, .small, .tiny { fill: #a0a0a0; }
      .label { fill: #f2f2f2; }
    }
    @media (prefers-reduced-motion: reduce) {
      .proposal, .accepted, .rejected { animation: none; }
      .packet, .packet-danger { display: none; }
    }
  </style>

  <rect class="bg" width="1200" height="680"/>
  <text class="kicker" x="52" y="45">THE CYBORG SCIENTIST</text>
  <text class="small" x="1148" y="45" text-anchor="end">meaning → search → check → memory</text>

  <g transform="translate(50 190)">
    <rect class="box" width="235" height="310"/>
    <text class="kicker" x="28" y="34">HUMAN PRINCIPAL</text>
    <circle class="box-soft" cx="118" cy="92" r="34"/>
    <path class="wire" d="M72 171 C72 139 164 139 164 171 L164 194 L72 194 Z"/>
    <line class="rule" x1="28" y1="215" x2="207" y2="215"/>
    <text class="small" x="28" y="241">chooses question</text>
    <text class="small" x="28" y="264">defines context</text>
    <text class="small" x="28" y="287">owns responsibility</text>
  </g>

  <g transform="translate(370 95)">
    <rect class="box-soft" width="300" height="205"/>
    <text class="kicker" x="28" y="35">AI AGENT FIELD</text>
    <text class="label" x="28" y="78">Search broadly.</text>
    <text class="small" x="28" y="112">translate · simulate · code</text>
    <text class="small" x="28" y="139">propose · compare · minimize</text>
    <line class="rule" x1="28" y1="164" x2="272" y2="164"/>
    <text class="tiny" x="28" y="188">CANDIDATES, NOT AUTHORITY</text>
  </g>

  <g transform="translate(370 385)">
    <rect class="box" width="300" height="205"/>
    <text class="kicker danger-text" x="28" y="35">REFINEMENT LOOP</text>
    <text class="label" x="28" y="78">Learn from failure.</text>
    <text class="small" x="28" y="112">counterexample · dispute</text>
    <text class="small" x="28" y="139">narrow scope · revise recipe</text>
    <line class="rule" x1="28" y1="164" x2="272" y2="164"/>
    <text class="tiny" x="28" y="188">FAILED CLAIMS REMAIN VISIBLE</text>
  </g>

  <g transform="translate(755 155)">
    <rect class="box" width="170" height="370"/>
    <text class="kicker" x="85" y="34" text-anchor="middle">VERIFIERS</text>
    <line class="rule" x1="28" y1="58" x2="142" y2="58"/>
    <text class="small" x="85" y="102" text-anchor="middle">Lean</text>
    <text class="small" x="85" y="148" text-anchor="middle">SMT</text>
    <text class="small" x="85" y="194" text-anchor="middle">replay</text>
    <text class="small" x="85" y="240" text-anchor="middle">fuzz</text>
    <text class="small" x="85" y="286" text-anchor="middle">benchmark</text>
    <line class="rule" x1="28" y1="315" x2="142" y2="315"/>
    <text class="tiny" x="85" y="344" text-anchor="middle">SCOPED</text>
  </g>

  <g transform="translate(990 145)">
    <rect class="memory" x="0" y="28" width="160" height="345"/>
    <rect class="memory" x="-12" y="16" width="160" height="345"/>
    <rect class="box-soft" x="-24" y="4" width="160" height="345"/>
    <text class="kicker" x="56" y="40" text-anchor="middle">POPPERPAD</text>
    <text class="label" x="56" y="80" text-anchor="middle">Memory</text>
    <line class="rule" x1="-2" y1="104" x2="114" y2="104"/>
    <text class="small" x="-2" y="139">claim</text>
    <text class="small" x="-2" y="171">context</text>
    <text class="small" x="-2" y="203">recipe</text>
    <text class="small" x="-2" y="235">evidence</text>
    <text class="small" x="-2" y="267">artifact</text>
    <text class="small" x="-2" y="299">attestation</text>
    <text class="tiny" x="56" y="329" text-anchor="middle">APPEND-ONLY</text>
  </g>

  <path id="humanToAgent" class="wire" d="M285 285 C320 285 334 210 370 210"/>
  <path class="proposal" d="M285 285 C320 285 334 210 370 210"/>
  <path id="agentToGate" class="wire" d="M670 210 C710 210 715 260 755 260"/>
  <path class="proposal" d="M670 210 C710 210 715 260 755 260"/>
  <path id="gateToMemory" class="wire" d="M925 290 C950 290 960 290 978 290"/>
  <path class="accepted" d="M925 290 C950 290 960 290 978 290"/>
  <path id="rejectLoop" class="wire" d="M840 525 C840 620 710 625 640 590 C610 575 630 520 670 500"/>
  <path class="rejected" d="M840 525 C840 620 710 625 640 590 C610 575 630 520 670 500"/>
  <path id="refineHuman" class="wire" d="M370 500 C325 500 322 402 285 402"/>
  <path class="rejected" d="M370 500 C325 500 322 402 285 402"/>
  <text class="tiny" x="320" y="245">DIRECTION</text>
  <text class="tiny" x="695" y="190">PROPOSALS</text>
  <text class="tiny" x="943" y="270">PASS</text>
  <text class="tiny danger-text" x="783" y="634">COUNTEREXAMPLE</text>
</svg>
