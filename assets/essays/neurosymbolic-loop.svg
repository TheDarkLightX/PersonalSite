<svg xmlns="http://www.w3.org/2000/svg" width="720" height="562" viewBox="0 0 720 562" role="img" aria-labelledby="title desc">
<title id="title">The neurosymbolic loop</title><desc id="desc">The model proposes a candidate. A symbolic checker returns accept, reject, or unresolved with evidence. All verdicts enter scoped memory, which informs the next proposal. Accept also produces a checked proof of the specified statement; it does not prove the specification matches human intent.</desc>
<rect width="720" height="562" fill="#faf9f5"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#58615e"/></marker></defs>
<text x="40" y="47" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#242b2b" text-anchor="start">The neurosymbolic loop</text>
<text x="40" y="82" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#58615e" text-anchor="start">The next proposal starts from the previous check.</text>
<rect x="50" y="135" width="250" height="96" rx="4" fill="#faf9f5" stroke="#84938b" stroke-width="2"/>
<text x="68" y="170" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#242b2b" text-anchor="start">MODEL</text>
<text x="68" y="204" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#58615e" text-anchor="start">Propose candidate pₜ</text>
<rect x="420" y="135" width="250" height="96" rx="4" fill="#faf9f5" stroke="#84938b" stroke-width="2"/>
<text x="438" y="170" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#242b2b" text-anchor="start">CHECKER</text>
<text x="438" y="204" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#58615e" text-anchor="start">Check candidate pₜ</text>
<rect x="50" y="365" width="250" height="96" rx="4" fill="#faf9f5" stroke="#84938b" stroke-width="2"/>
<text x="68" y="400" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#242b2b" text-anchor="start">MEMORY</text>
<text x="68" y="434" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#58615e" text-anchor="start">Verdict + evidence</text>
<rect x="420" y="365" width="250" height="96" rx="4" fill="#edf2ec" stroke="#84938b" stroke-width="2"/>
<text x="438" y="400" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#242b2b" text-anchor="start">CHECKED PROOF</text>
<text x="438" y="434" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#58615e" text-anchor="start">Of that exact statement</text>
<path d="M300 183 H417" fill="none" stroke="#58615e" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="360" y="166" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#242b2b" text-anchor="middle">pₜ</text>
<path d="M545 231 V360" fill="none" stroke="#58615e" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="565" y="312" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#086451" text-anchor="start">accept</text>
<circle cx="545" cy="270" r="4" fill="#58615e" stroke="#58615e" stroke-width="2"/>
<path d="M545 270 H351 V413 H305" fill="none" stroke="#58615e" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="344" y="299" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#58615e" text-anchor="end">all</text>
<text x="344" y="326" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#58615e" text-anchor="end">verdicts</text>
<path d="M175 365 V236" fill="none" stroke="#58615e" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="158" y="296" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#58615e" text-anchor="end">next</text>
<text x="158" y="323" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#58615e" text-anchor="end">context</text>
<text x="40" y="510" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#242b2b" text-anchor="start">Scope σ fixes the target, assumptions, checker, and versions.</text>
<text x="40" y="539" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#58615e" text-anchor="start">The operator still has to ask: is this the statement I meant?</text>
</svg>
