<svg xmlns="http://www.w3.org/2000/svg" width="720" height="532" viewBox="0 0 720 532" role="img" aria-labelledby="title desc"><title id="title">The prediction that defeats itself</title><desc id="desc">Run D on its own description, d.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#58615e"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#086451"/></marker><marker id="arrow-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#93422c"/></marker></defs><rect width="720" height="532" fill="#faf9f5"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="47" font-size="28" font-weight="700" fill="#242b2b" text-anchor="start">The prediction that defeats itself</text><text x="36" y="81" font-size="19" font-weight="400" fill="#58615e" text-anchor="start">Run D on its own description, d.</text><rect x="230" y="120" width="260" height="78" fill="#f6edd9" stroke="#cdb07e" stroke-width="1.7" rx="4"/><text x="360" y="151" font-size="26" font-weight="700" fill="#242b2b" text-anchor="middle">H(d, d)</text><text x="360" y="181" font-size="18" font-weight="400" fill="#58615e" text-anchor="middle">predicts D's fate</text><path d="M360 199 V224 H177 V255" fill="none" stroke="#58615e" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M360 224 H543 V255" fill="none" stroke="#58615e" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="46" y="268" width="262" height="75" fill="#fffefa" stroke="#cbd0c8" stroke-width="1.7" rx="4"/><rect x="412" y="268" width="262" height="75" fill="#fffefa" stroke="#cbd0c8" stroke-width="1.7" rx="4"/><text x="177" y="300" font-size="22" font-weight="700" fill="#242b2b" text-anchor="middle">H predicts HALT</text><text x="543" y="300" font-size="22" font-weight="700" fill="#242b2b" text-anchor="middle">H predicts LOOP</text><text x="177" y="328" font-size="19" font-weight="400" fill="#58615e" text-anchor="middle">says 1</text><text x="543" y="328" font-size="19" font-weight="400" fill="#58615e" text-anchor="middle">says 0</text><path d="M177 344 L177 367" fill="none" stroke="#93422c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-rust)" /><path d="M543 344 L543 367" fill="none" stroke="#93422c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-rust)" /><rect x="46" y="380" width="262" height="81" fill="#f6ebe6" stroke="#cda496" stroke-width="1.7" rx="4"/><rect x="412" y="380" width="262" height="81" fill="#f6ebe6" stroke="#cda496" stroke-width="1.7" rx="4"/><text x="177" y="413" font-size="22" font-weight="700" fill="#93422c" text-anchor="middle">D loops forever</text><text x="543" y="413" font-size="22" font-weight="700" fill="#93422c" text-anchor="middle">D halts</text><text x="177" y="443" font-size="19" font-weight="400" fill="#242b2b" text-anchor="middle">prediction wrong</text><text x="543" y="443" font-size="19" font-weight="400" fill="#242b2b" text-anchor="middle">prediction wrong</text><text x="360" y="506" font-size="23" font-weight="700" fill="#242b2b" text-anchor="middle">Both possible answers fail.</text></g></svg>