<svg xmlns="http://www.w3.org/2000/svg" width="720" height="458" viewBox="0 0 720 458" role="img" aria-labelledby="title desc"><title id="title">A theorem is not a physics experiment</title><desc id="desc">Moving from mathematics to nature requires assumptions.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#58615e"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#086451"/></marker><marker id="arrow-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#93422c"/></marker></defs><rect width="720" height="458" fill="#faf9f5"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="47" font-size="28" font-weight="700" fill="#242b2b" text-anchor="start">A theorem is not a physics experiment</text><text x="36" y="81" font-size="19" font-weight="400" fill="#58615e" text-anchor="start">Moving from mathematics to nature requires assumptions.</text><text x="37" y="136" font-size="19" font-weight="700" fill="#086451" text-anchor="start">01</text><text x="95" y="134" font-size="18" font-weight="700" fill="#086451" text-anchor="start">PROVED MATHEMATICS</text><text x="95" y="166" font-size="20" font-weight="400" fill="#242b2b" text-anchor="start">No Turing machine decides all halting instances.</text><path d="M36 194 L684 194" fill="none" stroke="#cbd0c8" stroke-width="1.3" /><text x="37" y="245" font-size="19" font-weight="700" fill="#965800" text-anchor="start">02</text><text x="95" y="243" font-size="18" font-weight="700" fill="#965800" text-anchor="start">CHURCH–TURING THESIS</text><text x="95" y="275" font-size="20" font-weight="400" fill="#242b2b" text-anchor="start">Effective procedures match Turing computability.</text><path d="M36 303 L684 303" fill="none" stroke="#cbd0c8" stroke-width="1.3" /><text x="37" y="354" font-size="19" font-weight="700" fill="#93422c" text-anchor="start">03</text><text x="95" y="352" font-size="18" font-weight="700" fill="#93422c" text-anchor="start">PHYSICAL COMPUTATION</text><text x="95" y="384" font-size="20" font-weight="400" fill="#242b2b" text-anchor="start">Further claims need a model of physical nature.</text><text x="36" y="430" font-size="19" font-weight="400" fill="#58615e" text-anchor="start">An implication between these levels is not automatic.</text></g></svg>