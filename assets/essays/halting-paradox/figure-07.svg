<svg xmlns="http://www.w3.org/2000/svg" width="720" height="395" viewBox="0 0 720 395" role="img" aria-labelledby="title desc"><title id="title">A sentence about its own proof</title><desc id="desc">Gödel encodes proof-checking inside arithmetic.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#58615e"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#086451"/></marker><marker id="arrow-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#93422c"/></marker></defs><rect width="720" height="395" fill="#faf9f5"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="47" font-size="28" font-weight="700" fill="#242b2b" text-anchor="start">A sentence about its own proof</text><text x="36" y="81" font-size="19" font-weight="400" fill="#58615e" text-anchor="start">Gödel encodes proof-checking inside arithmetic.</text><rect x="36" y="142" width="186" height="110" fill="#fffefa" stroke="#cbd0c8" stroke-width="1.7" rx="4"/><text x="129" y="184" font-size="25" font-weight="700" fill="#242b2b" text-anchor="middle">Theory T</text><text x="129" y="217" font-size="18" font-weight="400" fill="#58615e" text-anchor="middle">axioms + rules</text><path d="M225 198 L282 198" fill="none" stroke="#58615e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="292" y="135" width="391" height="125" fill="#e5eee7" stroke="#b3c9bc" stroke-width="1.7" rx="4"/><text x="315" y="169" font-size="22" font-weight="700" fill="#086451" text-anchor="start">Gödel sentence G</text><text x="315" y="210" font-size="24" font-weight="600" fill="#242b2b" text-anchor="start">“G has no proof in T.”</text><path d="M36 295 L684 295" fill="none" stroke="#cbd0c8" stroke-width="1.3" /><text x="36" y="331" font-size="20" font-weight="400" fill="#242b2b" text-anchor="start">If T is consistent and sufficiently strong,</text><text x="36" y="360" font-size="20" font-weight="400" fill="#242b2b" text-anchor="start">T cannot prove its own Gödel sentence.</text></g></svg>