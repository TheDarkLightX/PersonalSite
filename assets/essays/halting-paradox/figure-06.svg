<svg xmlns="http://www.w3.org/2000/svg" width="720" height="356" viewBox="0 0 720 356" role="img" aria-labelledby="title desc"><title id="title">Why simulation cannot settle it</title><desc id="desc">Any finite run leaves another step unobserved.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#58615e"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#086451"/></marker><marker id="arrow-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#93422c"/></marker></defs><rect width="720" height="356" fill="#faf9f5"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="47" font-size="28" font-weight="700" fill="#242b2b" text-anchor="start">Why simulation cannot settle it</text><text x="36" y="81" font-size="19" font-weight="400" fill="#58615e" text-anchor="start">Any finite run leaves another step unobserved.</text><path d="M52 195 L661 195" fill="none" stroke="#cbd0c8" stroke-width="3" /><circle cx="75" cy="195" r="13" fill="#fffefa" stroke="#58615e" stroke-width="2"/><text x="75" y="158" font-size="24" font-weight="600" fill="#242b2b" text-anchor="middle">0</text><circle cx="186" cy="195" r="13" fill="#fffefa" stroke="#58615e" stroke-width="2"/><text x="186" y="158" font-size="24" font-weight="600" fill="#242b2b" text-anchor="middle">1</text><circle cx="297" cy="195" r="13" fill="#fffefa" stroke="#58615e" stroke-width="2"/><text x="297" y="158" font-size="24" font-weight="600" fill="#242b2b" text-anchor="middle">2</text><circle cx="408" cy="195" r="13" fill="#fffefa" stroke="#58615e" stroke-width="2"/><text x="408" y="158" font-size="24" font-weight="600" fill="#242b2b" text-anchor="middle">···</text><circle cx="519" cy="195" r="13" fill="#e5eee7" stroke="#086451" stroke-width="2"/><text x="519" y="158" font-size="24" font-weight="600" fill="#242b2b" text-anchor="middle">N</text><path d="M532 195 L626 195" fill="none" stroke="#965800" stroke-width="3" stroke-dasharray="7 8"/><circle cx="647" cy="195" r="19" fill="#f6edd9" stroke="#965800" stroke-width="2"/><text x="647" y="202" font-size="29" font-weight="700" fill="#965800" text-anchor="middle">?</text><text x="647" y="148" font-size="22" font-weight="700" fill="#965800" text-anchor="middle">N + 1</text><text x="36" y="258" font-size="20" font-weight="700" fill="#086451" text-anchor="start">Observed:</text><text x="153" y="258" font-size="20" font-weight="400" fill="#242b2b" text-anchor="start">still running at step N</text><text x="36" y="301" font-size="20" font-weight="700" fill="#965800" text-anchor="start">Unknown:</text><text x="153" y="301" font-size="20" font-weight="400" fill="#242b2b" text-anchor="start">whether a later step is the last</text></g></svg>