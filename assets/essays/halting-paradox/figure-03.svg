<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" role="img" aria-labelledby="title desc"><title id="title">Some programs are easy</title><desc id="desc">The universal demand is the hard part.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#58615e"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#086451"/></marker><marker id="arrow-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#93422c"/></marker></defs><rect width="720" height="390" fill="#faf9f5"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="47" font-size="28" font-weight="700" fill="#242b2b" text-anchor="start">Some programs are easy</text><text x="36" y="81" font-size="19" font-weight="400" fill="#58615e" text-anchor="start">The universal demand is the hard part.</text><rect x="36" y="120" width="306" height="136" fill="#fffefa" stroke="#cbd0c8" stroke-width="1.7" rx="4"/><rect x="378" y="120" width="306" height="136" fill="#fffefa" stroke="#cbd0c8" stroke-width="1.7" rx="4"/><text x="56" y="155" font-size="19" font-weight="700" fill="#086451" text-anchor="start">HALTS</text><text x="398" y="155" font-size="19" font-weight="700" fill="#93422c" text-anchor="start">LOOPS</text><text x="56" y="195" font-size="23" font-weight="700" fill="#242b2b" text-anchor="start">return</text><text x="398" y="195" font-size="22" font-weight="700" fill="#242b2b" text-anchor="start">while true: repeat</text><text x="56" y="232" font-size="19" font-weight="400" fill="#58615e" text-anchor="start">We know this one stops.</text><text x="398" y="232" font-size="19" font-weight="400" fill="#58615e" text-anchor="start">We know this one does not.</text><path d="M36 290 L684 290" fill="none" stroke="#cbd0c8" stroke-width="1.3" /><text x="36" y="330" font-size="23" font-weight="700" fill="#242b2b" text-anchor="start">One decider for every possible program?</text><text x="36" y="360" font-size="20" font-weight="400" fill="#93422c" text-anchor="start">No. That is what the halting theorem rules out.</text></g></svg>