<svg xmlns="http://www.w3.org/2000/svg" width="720" height="406" viewBox="0 0 720 406" role="img" aria-labelledby="title desc"><title id="title">The proposed predictor H</title><desc id="desc">For every program P and input x, H must answer.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#58615e"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#086451"/></marker><marker id="arrow-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#93422c"/></marker></defs><rect width="720" height="406" fill="#faf9f5"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="47" font-size="28" font-weight="700" fill="#242b2b" text-anchor="start">The proposed predictor H</text><text x="36" y="81" font-size="19" font-weight="400" fill="#58615e" text-anchor="start">For every program P and input x, H must answer.</text><rect x="35" y="145" width="171" height="99" fill="#fffefa" stroke="#cbd0c8" stroke-width="1.7" rx="4"/><text x="120" y="184" font-size="28" font-weight="700" fill="#242b2b" text-anchor="middle">P, x</text><text x="120" y="218" font-size="17" font-weight="400" fill="#58615e" text-anchor="middle">program + input</text><path d="M209 193 L268 193" fill="none" stroke="#58615e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="280" y="145" width="158" height="99" fill="#f6edd9" stroke="#d0b67f" stroke-width="1.7" rx="4"/><text x="359" y="184" font-size="32" font-weight="700" fill="#242b2b" text-anchor="middle">H</text><text x="359" y="215" font-size="18" font-weight="400" fill="#58615e" text-anchor="middle">always returns</text><path d="M440 193 H491 V160 H536" fill="none" stroke="#58615e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M491 193 V265 H536" fill="none" stroke="#58615e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="546" y="119" width="138" height="81" fill="#e5eee7" stroke="#9abbac" stroke-width="1.7" rx="4"/><text x="615" y="154" font-size="29" font-weight="700" fill="#086451" text-anchor="middle">1</text><text x="615" y="182" font-size="19" font-weight="400" fill="#242b2b" text-anchor="middle">halts</text><rect x="546" y="224" width="138" height="81" fill="#f6ebe6" stroke="#cfb0a2" stroke-width="1.7" rx="4"/><text x="615" y="259" font-size="29" font-weight="700" fill="#93422c" text-anchor="middle">0</text><text x="615" y="287" font-size="19" font-weight="400" fill="#242b2b" text-anchor="middle">loops</text><path d="M36 345 L684 345" fill="none" stroke="#cbd0c8" stroke-width="1.3" /><text x="36" y="375" font-size="21" font-weight="400" fill="#242b2b" text-anchor="start">H must be right and finish on every input.</text></g></svg>