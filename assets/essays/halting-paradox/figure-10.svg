<svg xmlns="http://www.w3.org/2000/svg" width="720" height="404" viewBox="0 0 720 404" role="img" aria-labelledby="title desc"><title id="title">Three distinct questions</title><desc id="desc">Existence of an answer is not a decision method.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#58615e"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#086451"/></marker><marker id="arrow-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#93422c"/></marker></defs><rect width="720" height="404" fill="#faf9f5"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="47" font-size="28" font-weight="700" fill="#242b2b" text-anchor="start">Three distinct questions</text><text x="36" y="81" font-size="19" font-weight="400" fill="#58615e" text-anchor="start">Existence of an answer is not a decision method.</text><text x="36" y="147" font-size="19" font-weight="700" fill="#086451" text-anchor="start">TRUTH</text><text x="255" y="147" font-size="22" font-weight="400" fill="#242b2b" text-anchor="start">Is the statement true?</text><path d="M36 169 L684 169" fill="none" stroke="#cbd0c8" stroke-width="1.3" /><text x="36" y="228" font-size="19" font-weight="700" fill="#965800" text-anchor="start">COMPUTATION</text><text x="255" y="228" font-size="22" font-weight="400" fill="#242b2b" text-anchor="start">Can an algorithm decide it?</text><path d="M36 250 L684 250" fill="none" stroke="#cbd0c8" stroke-width="1.3" /><text x="36" y="309" font-size="19" font-weight="700" fill="#93422c" text-anchor="start">PROOF IN T</text><text x="255" y="309" font-size="22" font-weight="400" fill="#242b2b" text-anchor="start">Can theory T derive it?</text><path d="M36 331 L684 331" fill="none" stroke="#cbd0c8" stroke-width="1.3" /><text x="36" y="376" font-size="20" font-weight="400" fill="#58615e" text-anchor="start">These questions can have different answers.</text></g></svg>