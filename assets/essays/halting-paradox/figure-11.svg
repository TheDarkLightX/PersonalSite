<svg xmlns="http://www.w3.org/2000/svg" width="720" height="389" viewBox="0 0 720 389" role="img" aria-labelledby="title desc"><title id="title">A repeated state proves a loop</title><desc id="desc">For a deterministic finite-state machine.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#58615e"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#086451"/></marker><marker id="arrow-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#93422c"/></marker></defs><rect width="720" height="389" fill="#faf9f5"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="47" font-size="28" font-weight="700" fill="#242b2b" text-anchor="start">A repeated state proves a loop</text><text x="36" y="81" font-size="19" font-weight="400" fill="#58615e" text-anchor="start">For a deterministic finite-state machine.</text><circle cx="102" cy="202" r="34" fill="#fffefa" stroke="#58615e" stroke-width="2"/><text x="102" y="210" font-size="25" font-weight="700" fill="#242b2b" text-anchor="middle">A</text><circle cx="268" cy="202" r="34" fill="#e5eee7" stroke="#086451" stroke-width="2"/><text x="268" y="210" font-size="25" font-weight="700" fill="#242b2b" text-anchor="middle">B</text><circle cx="434" cy="202" r="34" fill="#fffefa" stroke="#58615e" stroke-width="2"/><text x="434" y="210" font-size="25" font-weight="700" fill="#242b2b" text-anchor="middle">C</text><circle cx="600" cy="202" r="34" fill="#fffefa" stroke="#58615e" stroke-width="2"/><text x="600" y="210" font-size="25" font-weight="700" fill="#242b2b" text-anchor="middle">D</text><path d="M139 202 L230 202" fill="none" stroke="#58615e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M305 202 L396 202" fill="none" stroke="#58615e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M471 202 L562 202" fill="none" stroke="#58615e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M600 242 V291 H268 V241" fill="none" stroke="#086451" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)" /><text x="436" y="319" font-size="18" font-weight="700" fill="#086451" text-anchor="middle">return to the same complete state</text><path d="M36 347 L684 347" fill="none" stroke="#cbd0c8" stroke-width="1.3" /><text x="36" y="377" font-size="20" font-weight="400" fill="#242b2b" text-anchor="start">The future repeats, so this run never halts.</text></g></svg>