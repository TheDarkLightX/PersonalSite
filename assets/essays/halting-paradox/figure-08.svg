<svg xmlns="http://www.w3.org/2000/svg" width="720" height="454" viewBox="0 0 720 454" role="img" aria-labelledby="title desc"><title id="title">The shared diagonal pattern</title><desc id="desc">Self-reference carries different logical consequences.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#58615e"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#086451"/></marker><marker id="arrow-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#93422c"/></marker></defs><rect width="720" height="454" fill="#faf9f5"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="47" font-size="28" font-weight="700" fill="#242b2b" text-anchor="start">The shared diagonal pattern</text><text x="36" y="81" font-size="19" font-weight="400" fill="#58615e" text-anchor="start">Self-reference carries different logical consequences.</text><text x="36" y="135" font-size="17" font-weight="700" fill="#58615e" text-anchor="start">CONSTRUCTION</text><text x="296" y="135" font-size="17" font-weight="700" fill="#58615e" text-anchor="start">SELF-REFERENCE</text><text x="550" y="135" font-size="17" font-weight="700" fill="#58615e" text-anchor="start">LIMIT</text><path d="M36 149 L684 149" fill="none" stroke="#cbd0c8" stroke-width="1.3" /><text x="36" y="202" font-size="24" font-weight="700" fill="#242b2b" text-anchor="start">Gödel</text><text x="296" y="188" font-size="20" font-weight="400" fill="#242b2b" text-anchor="start">G says it has</text><text x="296" y="217" font-size="20" font-weight="400" fill="#242b2b" text-anchor="start">no T-proof</text><text x="550" y="188" font-size="21" font-weight="700" fill="#086451" text-anchor="start">G unprovable</text><text x="550" y="216" font-size="18" font-weight="400" fill="#58615e" text-anchor="start">within T</text><path d="M36 257 L684 257" fill="none" stroke="#cbd0c8" stroke-width="1.3" /><text x="36" y="318" font-size="24" font-weight="700" fill="#242b2b" text-anchor="start">Turing</text><text x="296" y="304" font-size="20" font-weight="400" fill="#242b2b" text-anchor="start">D reverses H's</text><text x="296" y="333" font-size="20" font-weight="400" fill="#242b2b" text-anchor="start">prediction</text><text x="550" y="304" font-size="20" font-weight="700" fill="#93422c" text-anchor="start">No universal</text><text x="550" y="333" font-size="20" font-weight="700" fill="#93422c" text-anchor="start">halting decider</text><path d="M36 375 L684 375" fill="none" stroke="#cbd0c8" stroke-width="1.3" /><text x="36" y="411" font-size="20" font-weight="400" fill="#242b2b" text-anchor="start">Same mathematical move. Different objects and claims.</text></g></svg>