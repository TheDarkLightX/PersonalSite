<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Proof search and consistency</title><desc id="desc">Pₜ checks T-proofs for a proof of 0 = 1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#58615e"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#086451"/></marker><marker id="arrow-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#93422c"/></marker></defs><rect width="720" height="480" fill="#faf9f5"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="47" font-size="28" font-weight="700" fill="#242b2b" text-anchor="start">Proof search and consistency</text><text x="36" y="81" font-size="19" font-weight="400" fill="#58615e" text-anchor="start">Pₜ checks T-proofs for a proof of 0 = 1.</text><rect x="36" y="121" width="648" height="76" fill="#f6edd9" stroke="#d4c198" stroke-width="1.7" rx="4"/><text x="58" y="154" font-size="22" font-weight="700" fill="#242b2b" text-anchor="start">Pₜ: enumerate all T-proofs</text><text x="58" y="182" font-size="19" font-weight="400" fill="#58615e" text-anchor="start">Stop if a proof establishes 0 = 1.</text><text x="36" y="253" font-size="18" font-weight="700" fill="#93422c" text-anchor="start">IF T IS INCONSISTENT</text><text x="384" y="253" font-size="18" font-weight="700" fill="#086451" text-anchor="start">IF T IS CONSISTENT</text><path d="M36 270 L684 270" fill="none" stroke="#cbd0c8" stroke-width="1.3" /><text x="36" y="312" font-size="20" font-weight="400" fill="#242b2b" text-anchor="start">A contradictory proof exists.</text><text x="36" y="341" font-size="20" font-weight="400" fill="#242b2b" text-anchor="start">Pₜ eventually finds it.</text><text x="36" y="370" font-size="20" font-weight="400" fill="#242b2b" text-anchor="start">Pₜ halts.</text><text x="384" y="312" font-size="20" font-weight="400" fill="#242b2b" text-anchor="start">No contradictory proof exists.</text><text x="384" y="341" font-size="20" font-weight="400" fill="#242b2b" text-anchor="start">The search never succeeds.</text><text x="384" y="370" font-size="20" font-weight="400" fill="#242b2b" text-anchor="start">Pₜ runs forever.</text><path d="M36 416 L684 416" fill="none" stroke="#cbd0c8" stroke-width="1.3" /><text x="360" y="454" font-size="20" font-weight="700" fill="#242b2b" text-anchor="middle">Con(T)  ⇔  Pₜ never halts</text></g></svg>