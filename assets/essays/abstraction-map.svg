<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc">
<title id="title">Shrink the map. Keep the dangerous route.</title><desc id="desc">Six concrete states compress to three abstract states. Four private internal states map to Work. Every concrete step has an abstract step, including a Work self-loop; the route to Bad is preserved.</desc>
<rect width="720" height="560" fill="#faf9f5"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="context-stroke"/></marker></defs>
<text x="36" y="45" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#242b2b" text-anchor="start">Shrink the map. Keep the dangerous route.</text>
<text x="36" y="80" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#58615e" text-anchor="start">Same question: can the forbidden state be reached?</text>
<text x="36" y="118" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#58615e" text-anchor="start">DETAILED / 6 states</text>
