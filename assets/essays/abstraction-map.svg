<text x="455" y="171" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#242b2b" text-anchor="middle">c</text>
<circle cx="455" cy="277" r="23" fill="#e5eee7" stroke="#242b2b" stroke-width="2"/>
<text x="455" y="285" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#242b2b" text-anchor="middle">d</text>
<circle cx="640" cy="218" r="23" fill="#faf9f5" stroke="#93422c" stroke-width="2"/>
