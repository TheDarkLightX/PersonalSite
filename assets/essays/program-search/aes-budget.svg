<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img" aria-label="A finite key space beyond a practical time budget"><defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fcfaf4"/><stop offset="1" stop-color="#e9f1f4"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="6"/></filter></defs><rect width="1100" height="610" fill="url(#grad)"/><rect x="18" y="18" width="1064" height="574" rx="20" fill="none" stroke="#d3dce5" stroke-width="1"/><rect x="42" y="39" width="5" height="29" rx="2" fill="#d6a24b"/><text x="62" y="61" fill="#1e2d42" font-size="22" font-weight="720" text-anchor="start" font-family="system-ui,Arial,sans-serif">A finite key space beyond a practical time budget</text><rect x="110" y="178" width="280" height="230" rx="14" fill="#fffefb" stroke="#d5dfe5" stroke-width="1.6"/><text x="127" y="213" fill="#516780" font-size="15" font-weight="750" text-anchor="start" font-family="system-ui,Arial,sans-serif">AES-128 KEY SPACE</text><text x="127" y="293" fill="#1e2d42" font-size="36" font-weight="850" text-anchor="start" font-family="system-ui,Arial,sans-serif">2¹²⁸</text><text x="127" y="334" fill="#516780" font-size="18" font-weight="500" text-anchor="start" font-family="system-ui,Arial,sans-serif">≈ 3.4 × 10³⁸ keys</text><rect x="420" y="178" width="280" height="230" rx="14" fill="#fffefb" stroke="#d5dfe5" stroke-width="1.6"/><text x="437" y="213" fill="#516780" font-size="15" font-weight="750" text-anchor="start" font-family="system-ui,Arial,sans-serif">IMAGINARY SEARCH RATE</text><text x="437" y="293" fill="#1e2d42" font-size="36" font-weight="850" text-anchor="start" font-family="system-ui,Arial,sans-serif">10¹²</text><text x="437" y="334" fill="#516780" font-size="18" font-weight="500" text-anchor="start" font-family="system-ui,Arial,sans-serif">key checks per second</text><rect x="730" y="178" width="280" height="230" rx="14" fill="#fffefb" stroke="#d5dfe5" stroke-width="1.6"/><text x="747" y="213" fill="#516780" font-size="15" font-weight="750" text-anchor="start" font-family="system-ui,Arial,sans-serif">EXHAUSTIVE SEARCH TIME</text><text x="747" y="293" fill="#1e2d42" font-size="36" font-weight="850" text-anchor="start" font-family="system-ui,Arial,sans-serif">≈ 10¹⁹</text><text x="747" y="334" fill="#516780" font-size="18" font-weight="500" text-anchor="start" font-family="system-ui,Arial,sans-serif">years at that rate</text><text x="550" y="474" fill="#287f77" font-size="20" font-weight="700" text-anchor="middle" font-family="system-ui,Arial,sans-serif">Universe's current age: approximately 1.38 × 10¹⁰ years</text><text x="550" y="513" fill="#1e2d42" font-size="20" font-weight="700" text-anchor="middle" font-family="system-ui,Arial,sans-serif">Finite search space does not imply feasible brute force.</text></svg>